embeddings:
  active: bge-small
  models:
    bge-small:
      name: BAAI/bge-small-en-v1.5
      query_prompt: "Represent this sentence for searching relevant passages: "
    qwen3-0.6b:
      name: Qwen/Qwen3-Embedding-0.6B
      query_prompt_name: query
      max_seq_length: 512        # same truncation as bge-small; longer inputs run out of memory on MPS

retrieval:
  # rerank on, hybrid off: with full pooled judgments, reranking raised MRR (0.64 -> 0.76) and
  # hybrid lowered it (0.64 -> 0.50); see eval/README.md
  hybrid: false                 # also run Postgres full-text search and fuse both rankings (Reciprocal Rank Fusion)
  rrf_k: 60                     # RRF constant: score = sum of 1 / (rrf_k + rank); 60 is the usual default
  rerank: true                 # rescore the candidates with a cross-encoder
  reranker_model: BAAI/bge-reranker-base
  candidates: 30                # papers taken from each search before fusion / reranking
  threshold: true               # drop papers below a minimum score; can return no papers at all
  min_similarity: 0.62          # longer questions: cosine similarity a paper needs; scripts/12_threshold.py
  short_query_words: 5          # queries with at most this many words are judged by the reranker instead (0 = off)
  min_rerank_score_short: 0.5   # short queries: reranker score (0 to 1) a paper needs; scripts/14_keyword_queries.py

tutor:
  clarify_vague: true           # ask what the user means when a first question is too vague to search

llm:
  provider: groq
  model: qwen3:8b
  groq_model: qwen/qwen3.8-27b
  temperature: 0        # 0 = always pick the most likely word
  reasoning: false
  top_k: 5
  prompt: strict        # basic or strict (every sentence must be backed by a cited source); strict was slightly better, see README

refresh:
  days: 14                # look back this many days (OpenAlex indexes with a delay, so overlap is fine)
  max_papers: 20          # add at most this many papers per refresh
  min_similarity: 0.75    # cosine similarity to the closest learn query; top papers score ~0.82-0.85,
                          # spam and off-topic ~0.55-0.71 (1,108 candidates above 0.70, 328 above 0.75)
