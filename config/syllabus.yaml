# Paper-tutor corpus configuration
# areas:    your own grouping; each area lists OpenAlex topics (what gets downloaded)
#           and learn items (what you want to study)
# settings: credibility rules applied to every paper

settings:
  papers_per_topic: 200          # cap per OpenAlex topic while exploring
  language: en
  keep_types: [article, review, preprint, conference-paper]
  min_abstract_words: 30         # shorter "abstracts" are mostly citation strings; 0 turns the rule off
  venue_lists: [cwts-core]       # peer-reviewed papers must come from a listed journal
  venue_exempt_types: [preprint, conference-paper]   # no journal-list requirement for these types
  preprint_servers:              # preprints must come from one of these; open repositories such as Zenodo
                                 # are full of auto-generated spam (589 of 1,716 recent candidates)
    - arXiv (Cornell University)
    - "RePEc: Research Papers in Economics"
    - SSRN Electronic Journal
    - HAL (Le Centre pour la Communication Scientifique Directe)
  dedup_year_window: 3           # same title within 3 years = one paper (0 = same year only, the old rule)
  authors_per_paper: 5           # author names stored per paper
  check_arxiv_titles: true       # drop records whose title differs from arXiv's (corrupted OpenAlex metadata)
  recent_years: 2                # newer papers are labelled "recent" instead of ranked by citations
  selections: [random, top_cited]   # random: for measuring rules; top_cited: for learning

