# Retrieval test set: one question per paper, 4 papers per area.
# Questions were written by an LLM from each paper's title and abstract, following these rules:
# plain student language, asked before knowing the answer, no distinctive terms from the title,
# all questions written before any search was run and not changed afterwards.
# Because they were written while reading the abstract, they may be easier than real student
# questions (vocabulary from the abstract can leak into the question).

