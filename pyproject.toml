[project]
name = "paper-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aymen Feki", email = "Feki.Aymen@campus.lmu.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "mcp[cli]>=2.3.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyalex>=0.21",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
paper-tutor = "paper_tutor:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's default rules plus import sorting ("I")
extend-select = ["I"]
