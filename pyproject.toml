[project]
name = "paper-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aymen Feki", email = "Feki.Aymen@campus.lmu.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyalex>=0.21",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
paper-tutor = "paper_tutor:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
